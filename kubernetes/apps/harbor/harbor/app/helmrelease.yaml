---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  chart:
    spec:
      chart: harbor
      version: 1.17.0
      sourceRef:
        kind: HelmRepository
        name: harbor
  interval: 1h
  values:
    expose:
      type: clusterIP
      tls:
        enabled: false
    externalURL: http://harbor-core.harbor.svc.cluster.local
    harborAdminPassword: "${HARBOR_ADMIN_PASSWORD}"
    secretKey: "${HARBOR_SECRET_KEY}"
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          storageClass: longhorn
          size: 50Gi
        database:
          storageClass: longhorn
          size: 5Gi
        redis:
          storageClass: longhorn
          size: 1Gi
        jobservice:
          jobLog:
            storageClass: longhorn
            size: 1Gi
        trivy:
          storageClass: longhorn
          size: 5Gi
    portal:
      replicas: 1
      resources:
        requests:
          cpu: 25m
        limits:
          memory: 256Mi
    core:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 512Mi
    registry:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 512Mi
    jobservice:
      replicas: 1
      resources:
        requests:
          cpu: 50m
        limits:
          memory: 512Mi
    database:
      type: internal
      internal:
        resources:
          requests:
            cpu: 200m
          limits:
            memory: 1Gi
    redis:
      type: internal
      internal:
        resources:
          requests:
            cpu: 50m
          limits:
            memory: 256Mi
    trivy:
      enabled: true
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 1Gi
    notary:
      enabled: false
    metrics:
      enabled: false
    trace:
      enabled: false
