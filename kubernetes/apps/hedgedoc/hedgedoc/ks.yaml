---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hedgedoc
spec:
  dependsOn:
    - name: hedgedoc-postgres
      namespace: hedgedoc
  interval: 1h
  path: ./kubernetes/apps/hedgedoc/hedgedoc/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: hedgedoc
  wait: false
