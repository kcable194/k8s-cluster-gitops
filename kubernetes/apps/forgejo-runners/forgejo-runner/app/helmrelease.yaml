---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  values:
    replicaCount: 1

    runner:
      config:
        instance: "https://forgejo.${SECRET_DOMAIN}"
        name: forgejo-runner
        token: "${FORGEJO_RUNNER_TOKEN}"
        file:
          runner:
            capacity: 2
            timeout: 3h
            labels:
              - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
              - "docker:docker://node:22-bookworm"
              - "self-hosted"
          container:
            network: ""
            privileged: true
            docker_host: "-"
            options: "--volume /var/run/docker.sock:/var/run/docker.sock"
            valid_volumes:
              - "/var/run/docker.sock"

    dind:
      image:
        repository: library/docker
        tag: dind
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 8Gi

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: forgejo
              topologyKey: kubernetes.io/hostname
