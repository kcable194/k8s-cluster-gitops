---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      version: 1.8.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 1h
  values:
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataLocality: best-effort
      defaultDataPath: /var/lib/longhorn
      storageOverProvisioningPercentage: 100
      storageMinimalAvailablePercentage: 10
      guaranteedInstanceManagerCPU: 5
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: true
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      taintToleration: "node-role.kubernetes.io/ci:NoExecute"
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: ext4
    longhornManager:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/ci
          operator: Exists
          effect: NoExecute
    longhornDriver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/ci
          operator: Exists
          effect: NoExecute
    ingress:
      enabled: false
    enablePSP: false
