---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-runner-set
spec:
  dependsOn:
    - name: arc
      namespace: actions-runner-system
  interval: 1h
  path: ./kubernetes/apps/actions-runners/arc-runner-set/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runners
  wait: false
