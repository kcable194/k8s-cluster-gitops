---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  values:
    replicaCount: 1

    runner:
      config:
        instance: "https://forgejo.${SECRET_DOMAIN}"
        name: forgejo-runner
        token: "${FORGEJO_RUNNER_TOKEN}"
        file:
          runner:
            capacity: 2
            timeout: 3h
            labels:
              - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
              - "docker:docker://node:22-bookworm"
              - "self-hosted"
            envs:
              DOCKER_HOST: "tcp://127.0.0.1:2376"
              DOCKER_TLS_VERIFY: "1"

          container:
            network: ""
            privileged: true
            docker_host: "-"

    dind:
      image:
        repository: library/docker
        tag: dind
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 4Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 4Gi
