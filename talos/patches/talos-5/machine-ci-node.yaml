machine:
  nodeLabels:
    node-role.kubernetes.io/ci: ""
  nodeTaints:
    node-role.kubernetes.io/ci: ":NoExecute"
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
