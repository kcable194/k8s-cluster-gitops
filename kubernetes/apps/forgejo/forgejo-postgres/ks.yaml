---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-postgres
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: longhorn
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/forgejo/forgejo-postgres/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: true
